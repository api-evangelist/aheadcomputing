aid: aheadcomputing
name: AheadComputing
description: 'AheadComputing Inc. is a Portland, Oregon fabless semiconductor startup
  founded in 2024 by former Intel CPU architects — CEO Debbie Marr, Jonathon Pearce,
  Mark Dechene and Srikanth Srinivasan — that designs and licenses high-performance
  64-bit RISC-V application processor cores. The company markets a clean-slate, massive
  out-of-order "big core" architecture aimed at eliminating per-core CPU bottlenecks
  for AI, cloud, client, mobile and edge workloads, and has raised roughly $53M across
  a $21.5M seed and a $30M Seed2 round co-led by Eclipse, Toyota Ventures and Cambium.
  Its product is silicon IP licensed to chip designers rather than software, so it
  publishes no public API, developer portal, SDK or machine-readable contract.'
